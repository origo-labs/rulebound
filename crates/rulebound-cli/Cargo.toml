[package]
name = "rulebound-cli"
description = "The single rulebound binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rulebound"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rulebound-git = { workspace = true }
rulebound-observe = { workspace = true }
rulebound-orchestrate = { workspace = true }
rulebound-exec = { workspace = true }
rulebound-report = { workspace = true }
rulebound-service = { workspace = true }
toml = { workspace = true }
rulebound-contract = { workspace = true }
camino = { workspace = true }
clap = { workspace = true }

# The package metadata `cargo install` needs, duplicated from the workspace
# because `cargo install` reads the package manifest and cannot see inherited
# fields that resolve only at the workspace root. Repeated deliberately: the
# alternative is a publishing step, and a beta should be installable from a
# git tag without one.
[package.metadata.docs.rs]
all-features = true
